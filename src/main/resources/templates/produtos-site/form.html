<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="_layout :: head(${titulo})"></head>

<div th:replace="_layout :: layout('Cadastro Produto', ~{::content})">
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 m-0" th:text="${titulo}">Cliente</h1>
            <a class="btn btn-secondary" th:href="@{/produtos-site}">Voltar</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/produtos-site}" th:object="${produto}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label class="form-label">Nome *</label>
                        <input class="form-control" th:field="*{nome}" required />
                        <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea rows="3" class="form-control" th:field="*{descricao}" ></textarea>
                        <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preço</label>
                        <input type="number" step="0.1" min="0" class="form-control" th:field="*{preco}" required />
                        <div class="text-danger small" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome Imagem *</label>
                        <input class="form-control" th:field="*{nomeImg}" required />
                        <div class="text-danger small" th:if="${#fields.hasErrors('nomeImg')}" th:errors="*{nomeImg}"></div>
                    </div>

                    <button class="btn btn-primary" style="margin-top: 20px;" type="submit">Salvar</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
