<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${titulo} ?: 'Sistema de Pedidos'"> Sistema de Pedidos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
        }
    </script>
</head>

<body>
    <div th:fragment="layout(titulo, conteudo)" class="app">
        <!-- SIDEBAR-->
        <aside class="sidebar">
            <div class="brand mb-3">
                <div>
                    <div class="fw-bold">Sistema de Pedidos</div>
                    <small style="opacity: 0.8;">Painel Administrativo</small>
                </div>
            </div>
            <nav class="nav flex-column">
                <div class="menu-label">Geral</div>
                <a class="nav-link" th:classappend="${active=='home' ? ' active' : ''}" 
                    th:href="@{/}">
                    <span>Início</span>
                </a>
                <div class="menu-label">Cadastros</div>
                <a class="nav-link" th:classappend="${active=='clientes' ? ' active' : ''}"
                    th:href="@{/clientes-site}">
                    <span>Clientes</span>
                </a>
                <a class="nav-link" th:classappend="${active=='clientes' ? ' active' : ''}"
                    th:href="@{/produtos-site}">
                    <span>Produtos</span>
                </a>
                <a class="nav-link" th:classappend="${active=='pedidos' ? ' active' : ''}"
                    th:href="@{/pedidos-site}">
                    <span>Pedidos</span>
                </a>
            </nav>
            <hr class="my-4" />
            <div class="small" style="opacity: 0.7;">
                v0.0.1 * <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}">
                    --/--/----
                </span>
            </div>
        </aside>
        <!-- COLUNA DIREITA -->
        <div>
            <!-- TOP BAR -->
            <div class="topbar" >
                <button class="btn btn-light btn-sm btn-menu" type="button" 
                    onclick="toggleSidebar()">☰</button>
                <div class="fw-semibold" th:text="${titulo} ? 'Dashboard'">Dashboard</div>
            </div>
            
            <!-- CONTEUDO -->
            <main class="content" >
                <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
                <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
                <div class="row g-3 mb-3">

                </div>

                <div class="card card-soft">
                    <div class="card-body">
                        <div th:insert="${conteudo}"></div>
                    </div>
                </div>
            </main>

        </div>
    </div>
</body>

</html>
